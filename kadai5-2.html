<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>演習課題5-2：外部APIの呼び出しテスト</title>
</head>
<body>
    <h1 id="msg">IP情報取得API</h1>
    <form name="apiform"><p>
        任意の入力（表示用）：<input type="text" name="form_data">
        <button type="button" id="btn1" onclick="some_api(this.form)">実行</button>
    </p></form>

    <div id="result">ここに結果が表示されます<br /></div>

    <script>
        async function some_api(myForm) {
            document.getElementById("result").innerHTML += myForm.form_data.value + "<br />";
            document.apiform.reset();

            try {
                const response = await fetch("https://ipapi.co/json/");
                if (!response.ok) {
                    throw new Error("APIリクエストに失敗しました");
                }
                const data = await response.json();

                const info = `
                    あなたのIP: ${data.ip}<br />
                    国: ${data.country_name} (${data.country})<br />
                    地域: ${data.region}<br />
                    都市: ${data.city}<br />
                    タイムゾーン: ${data.timezone}<br /><br />
                `;
                document.getElementById("result").innerHTML += info;
            } catch (error) {
                document.getElementById("result").innerHTML += 
                    `<span style="color: red;">エラー: ${error.message}</span><br /><br />`;
            }
        }
    </script>
</body>
</html>
